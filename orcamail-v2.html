<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaMail — Temporarily Offline</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0a0814; color:#f0eeff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      padding:24px;
    }
    .card {
      max-width:560px; width:100%; text-align:center;
      background:#151225; border:1px solid rgba(255,255,255,.1);
      border-radius:20px; padding:40px 28px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    .badge {
      display:inline-block; font-size:12px; font-weight:700; letter-spacing:.06em;
      text-transform:uppercase; color:#e8b84b;
      border:1px solid rgba(232,184,75,.35); background:rgba(232,184,75,.08);
      border-radius:999px; padding:6px 12px; margin-bottom:18px;
    }
    h1 { font-size:1.6rem; margin-bottom:14px; }
    p { color:#b7b3d1; line-height:1.65; font-size:1.05rem; margin-bottom:22px; }
    a.btn {
      display:inline-block; text-decoration:none; font-weight:700;
      color:#0a0814; background:linear-gradient(90deg,#9b7fe8,#00e5ff);
      padding:14px 22px; border-radius:12px;
    }
    a.btn:hover { opacity:.92; }
    .foot { margin-top:22px; font-size:.85rem; color:#6d6888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Temporarily offline</div>
    <h1>OrcaMail</h1>
    <p>Temporarily offline because Lightchain Hub is too centralized to be associated with. All other apps in the OrcaPod up and running.</p>
    <a class="btn" href="https://keiko-dev-lcai.github.io/orcapod/" target="_blank" rel="noopener">Open OrcaPod →</a>
    <p class="foot">OrcaPod directory of live apps</p>
  </div>
</body>
</html>
