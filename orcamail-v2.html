<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OrcaMail — Moving to Lightapps.ai</title>
<style>
  :root{--bg:#0b1220;--card:#111a2e;--cyan:#2E9BF0;--muted:#8aa0bd;--text:#eaf1fb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#12263f 0%,var(--bg) 60%);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;width:100%;background:var(--card);border:1px solid rgba(46,155,240,0.25);
        border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.45)}
  .orca{font-size:52px;line-height:1;margin-bottom:14px}
  h1{margin:0 0 6px;font-size:22px;font-weight:700}
  .app{color:var(--cyan)}
  p{margin:14px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
  .btn{display:inline-block;margin-top:26px;padding:13px 26px;border-radius:10px;
       background:var(--cyan);color:#04121f;font-weight:700;text-decoration:none;font-size:15px}
  .btn:hover{filter:brightness(1.08)}
  .foot{margin-top:22px;font-size:12px;color:#5f7590}
  .foot{color:#5f7590}
</style>
</head>
<body>
  <div class="card">
    <div class="orca">🐬</div>
    <h1><span class="app">OrcaMail</span> is moving</h1>
    <p>This app will soon be available on <strong>Lightapps.ai</strong> — the home for Lightchain apps.</p>
    <a class="btn" href="https://lightapps.ai">Visit Lightapps.ai →</a>
    <div class="foot">Check back soon.</div>
  </div>
</body>
</html>
